version: '3.8'

services:
  db:
    image: postgres:15
    container_name: talentlink_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: talentlink_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/talentlink
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: